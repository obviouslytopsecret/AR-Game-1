<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06140d">
<title>AR Pong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:wght@400;600;700&display=swap">
<style>
:root{--ink:#06140d;--panel:rgba(6,20,13,.9);--line:#e9f3ec;--muted:#9cc7b0;--orange:#ff7a2f;--green:#3ee08a;
  --display:"Bungee","Arial Black",system-ui,sans-serif;--body:"DM Sans",system-ui,-apple-system,sans-serif;color-scheme:dark}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--line);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#000}
canvas{position:fixed;inset:0;z-index:1}
#ui{position:fixed;inset:0;z-index:2;touch-action:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:max(24px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
  background:radial-gradient(120% 80% at 50% 0%,#0f5a3c 0%,var(--ink) 70%);text-align:center;overflow-y:auto}
[hidden]{display:none!important}
h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,15vw,84px);line-height:.9;margin:0}
h1 .o{color:var(--orange)}h1 .g{color:var(--green)}
p{margin:0;line-height:1.45}
.sub{color:var(--muted);max-width:32ch;font-size:16px}
.col{display:flex;flex-direction:column;gap:12px;width:min(330px,100%)}
.row{display:flex;gap:10px}
button{font-family:var(--display);font-size:19px;padding:15px 16px;border-radius:14px;border:0;background:var(--line);color:var(--ink);cursor:pointer;touch-action:manipulation}
button.alt{background:transparent;color:var(--line);border:2px solid var(--muted)}
button.hot{background:var(--orange)}
button:disabled{opacity:.45}
input{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.2em;text-align:center;width:100%;min-width:0;
  padding:13px 8px;border-radius:14px;border:2px solid var(--muted);background:rgba(0,0,0,.3);color:var(--line)}
.code{font-family:var(--display);font-size:56px;letter-spacing:.12em;color:var(--orange);line-height:1}
#qr{background:#fff;padding:10px;border-radius:12px;line-height:0}
#qr img,#qr canvas{position:static;display:block}
.small{font-size:13px;color:var(--muted);max-width:34ch}
.status{font-weight:600;min-height:1.4em}
#hud{position:absolute;inset:0;pointer-events:none}
#hud .top{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;
  background:linear-gradient(rgba(0,0,0,.55),transparent)}
#score{font-family:var(--display);font-size:28px;letter-spacing:.04em}
#score .me{color:var(--orange)}#score .them{color:var(--green)}
#msg{font-weight:700;font-size:15px;text-shadow:0 1px 3px #000;max-width:30ch;text-align:center}
#hud .bot{position:absolute;left:0;right:0;bottom:0;padding:10px 14px max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;gap:10px;pointer-events:none}
#hud .bot button{pointer-events:auto;font-size:14px;padding:10px 14px;background:rgba(233,243,236,.18);color:var(--line);backdrop-filter:blur(6px)}
#over{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:auto;background:var(--panel);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;align-items:center;width:min(300px,84vw);text-align:center}
#overTxt{font-family:var(--display);font-size:30px}
#net{font-size:12px;font-weight:600;color:var(--muted);text-shadow:0 1px 3px #000}
#net.ok{color:var(--green)}#net.bad{color:#ff6b6b}
#bStart{position:absolute;left:50%;transform:translateX(-50%);bottom:max(120px,calc(env(safe-area-inset-bottom) + 112px));pointer-events:auto;font-size:22px;padding:16px 28px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#dbg{font:11px/1.3 ui-monospace,Menlo,monospace;color:rgba(233,243,236,.75);text-shadow:0 1px 2px #000}
#bMode.warn{background:var(--orange);color:var(--ink)}
#hint{position:absolute;left:0;right:0;bottom:max(70px,calc(env(safe-area-inset-bottom) + 64px));text-align:center;font-size:14px;color:var(--line);text-shadow:0 1px 3px #000;opacity:.85}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay hidden></video>
<div id="ui">
  <section id="menu" class="screen">
    <h1><span class="o">AR</span><br><span class="g">PONG</span></h1>
    <p class="sub">Each of you plays on your own phone. Your court sits on the table in front of you.</p>
    <div class="col">
      <button id="bHost">Host a game</button>
      <div class="row"><input id="code" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Room code"><button id="bJoin" class="alt">Join</button></div>
      <button id="bSolo" class="alt">Solo vs computer</button>
    </div>
    <p class="status" id="mStatus"></p>
  </section>

  <section id="lobby" class="screen" hidden>
    <div id="hostBox" class="col" hidden style="align-items:center">
      <p class="sub">Room code</p>
      <div class="code" id="roomCode">····</div>
      <div id="qr"></div>
      <p class="small">Your friend scans this, or opens the same page and types the code.</p>
    </div>
    <div id="guestBox" hidden><p class="sub">Room</p><div class="code" id="guestCode"></div></div>
    <div id="soloBox" hidden><p class="sub" style="font-size:20px">Solo vs computer</p></div>
    <p class="status" id="lStatus"></p>
    <div class="col">
      <button id="bAR" class="hot">Start AR</button>
      <button id="bSimpleL" class="alt" hidden>Simple mode (no AR tracking)</button>
      <button id="bBack" class="alt">Back</button>
    </div>
    <p class="small" id="modeHint"></p>
  </section>

  <div id="hud" hidden>
    <div class="top"><div id="score"><span class="me">0</span> · <span class="them">0</span></div><div id="msg"></div><div id="net"></div><div id="dbg"></div></div>
    <div id="hint"></div>
    <button id="bStart" class="hot" hidden>Start game</button>
    <div id="over" hidden><div id="overTxt"></div><button id="bRematch" class="hot">Rematch</button><p class="small" id="overSub"></p></div>
    <div class="bot"><button id="bExit">Exit</button><button id="bMode" hidden>Simple mode</button><button id="bPlace">Re-center</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
// ---- court constants (meters) ----
const W=0.30,L=0.50,PW=0.085,PD=0.018,R=0.012,WIN=7,V0=0.42,VMAX=1.15,HZ=L/2-0.025;
const PREFIX='arpong-gc-v1-';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ---- state ----
let role=null;            // 'host' | 'guest' | 'solo'
let peer=null,conn=null,connected=false;
let mode=null;            // 'xr' | 'cam'
let placed=false,started=false,guestReady=false,lastRx=0,roomCode='',xrT0=0,lastHit=0,tx=0,rx=0,xrTrack='off',badSince=0,useGyro=true,toCam=false;
const viewPos=new THREE.Vector3(),viewQ=new THREE.Quaternion();
let myX=0;                // my paddle x in my own frame (+x = my right)
const S={bx:0,bz:0,vx:0,vz:0,spd:0,hx:0,gx:0,sh:0,sg:0,ph:'wait',hits:0,dir:1,serveAt:0,win:null};
let rxAt=0,cpuErr=0;
let xrOK=false;
if(navigator.xr&&navigator.xr.isSessionSupported){navigator.xr.isSessionSupported('immersive-ar').then(v=>{xrOK=v;hint()}).catch(()=>{});}

// ---- audio ----
let ac=null;
function initAudio(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}}
function beep(f,d=.06,type='square',v=.07){if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d+.03);}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
let wake=null;async function keepAwake(){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&started)keepAwake()});

// ---- three.js scene ----
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x000000,0);
renderer.outputEncoding=THREE.sRGBEncoding;renderer.xr.enabled=true;
document.body.insertBefore(renderer.domElement,$('ui'));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(63,innerWidth/innerHeight,0.01,20);
scene.add(new THREE.HemisphereLight(0xffffff,0x224433,1.1));
const sun=new THREE.DirectionalLight(0xffffff,.7);sun.position.set(.3,1,.5);scene.add(sun);
addEventListener('resize',()=>{if(renderer.xr.isPresenting)return;renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

const court=new THREE.Group();court.visible=false;scene.add(court);
const ORANGE=0xff7a2f,GREEN=0x3ee08a,WHITE=0xe9f3ec;
const mat=(c,o=1,e=0)=>new THREE.MeshStandardMaterial({color:c,transparent:o<1,opacity:o,emissive:c,emissiveIntensity:e,roughness:.6});
const box=(w,h,d,m)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
{ const floor=new THREE.Mesh(new THREE.PlaneGeometry(W,L),new THREE.MeshBasicMaterial({color:0x0f5a3c,transparent:true,opacity:.6}));
  floor.rotation.x=-Math.PI/2;court.add(floor);
  const lm=mat(WHITE,.95,.4);
  for(const s of[-1,1]){const r=box(.008,.016,L+.016,mat(WHITE,.9,.3));r.position.set(s*(W/2+.004),.008,0);court.add(r);}
  for(let i=0;i<9;i++){const d=box(.018,.001,.003,lm);d.position.set(-W/2+W*(i+.5)/9,.001,0);court.add(d);}
}
const nearLine=box(W,.002,.004,mat(ORANGE,1,.6));nearLine.position.set(0,.001,L/2);court.add(nearLine);
const farLine=box(W,.002,.004,mat(GREEN,1,.6));farLine.position.set(0,.001,-L/2);court.add(farLine);
const padMe=box(PW,.02,PD,mat(ORANGE,1,.55)),padThem=box(PW,.02,PD,mat(GREEN,1,.55));court.add(padMe,padThem);
const ball=new THREE.Mesh(new THREE.SphereGeometry(R,24,16),mat(0xfffbe8,1,.5));court.add(ball);
const shadow=new THREE.Mesh(new THREE.CircleGeometry(R*1.2,20),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.35}));
shadow.rotation.x=-Math.PI/2;court.add(shadow);
const reticle=new THREE.Mesh(new THREE.RingGeometry(.035,.045,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:WHITE}));
reticle.matrixAutoUpdate=false;reticle.visible=false;scene.add(reticle);

function placeView(){ // render state (host frame) into my view frame
  const f=role==='guest'?-1:1;
  const hostX=role==='host'||role==='solo'?myX:S.hx, guestX=role==='guest'?-myX:S.gx;
  let bx=S.bx,bz=S.bz;
  if(role==='guest'&&S.ph==='play'){const dt=Math.min(.12,(performance.now()-rxAt)/1000);bx+=S.vx*dt;bz+=S.vz*dt;bx=clamp(bx,-W/2+R,W/2-R);}
  const hp=new THREE.Vector3(f*hostX,.01,f*HZ),gp=new THREE.Vector3(f*guestX,.01,-f*HZ);
  if(role==='guest'){padMe.position.copy(gp);padThem.position.copy(hp);}else{padMe.position.copy(hp);padThem.position.copy(gp);}
  const vis=S.ph==='play'||S.ph==='serve';
  ball.visible=shadow.visible=vis;
  ball.position.set(f*bx,R+.002,f*bz);shadow.position.set(f*bx,.0015,f*bz);
}

// ---- input: drag anywhere ----
const ui=$('ui');let dragId=null,lastX=0;
ui.addEventListener('pointerdown',e=>{if(e.target.closest('button,input'))return;dragId=e.pointerId;lastX=e.clientX;});
ui.addEventListener('pointermove',e=>{if(e.pointerId!==dragId)return;const dx=e.clientX-lastX;lastX=e.clientX;
  myX=clamp(myX+dx/innerWidth*W*1.7,-W/2+PW/2,W/2-PW/2);});
const up=e=>{if(e.pointerId===dragId)dragId=null};ui.addEventListener('pointerup',up);ui.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')myX-=.02;if(e.key==='ArrowRight')myX+=.02;myX=clamp(myX,-W/2+PW/2,W/2-PW/2);});

// ---- physics (host and solo are authoritative) ----
function begin(){S.sh=0;S.sg=0;S.win=null;serve(Math.random()<.5?1:-1,1600);}
function serve(dir,ms){S.bx=0;S.bz=0;S.vx=0;S.vz=0;S.hits=0;S.dir=dir;S.ph='serve';S.serveAt=performance.now()+ms;}
function launch(){S.spd=V0;const a=Math.random()*.7-.35;S.vx=Math.sin(a)*S.spd;S.vz=Math.cos(a)*S.spd*S.dir;S.ph='play';beep(520,.08,'sine');}
function bounce(px,dir){S.hits++;const off=clamp((S.bx-px)/(PW/2),-1,1);S.spd=Math.min(S.spd*1.07,VMAX);
  const a=off*.9;S.vx=Math.sin(a)*S.spd;S.vz=Math.cos(a)*S.spd*dir;
  if(role==='solo'&&dir<0)cpuErr=(Math.random()-.5)*PW*(.9+S.hits*.08);}
function point(h){if(h)S.sh++;else S.sg++;
  if(S.sh>=WIN||S.sg>=WIN){S.ph='over';S.win=S.sh>S.sg?'h':'g';return;}
  serve(h?-1:1,1300);}
function cpu(dt){let t=0;if(S.ph==='play'&&S.vz<0){const tt=(S.bz+HZ)/-S.vz;let x=S.bx+S.vx*tt;const lo=-W/2+R,span=W-2*R;
  x-=lo;x=((x%(2*span))+2*span)%(2*span);if(x>span)x=2*span-x;t=x+lo+cpuErr;}
  const mv=(.32+S.sg*.015)*dt;S.gx=clamp(S.gx+clamp(t-S.gx,-mv,mv),-W/2+PW/2,W/2-PW/2);}
function physics(dt){
  if(role==='host'||role==='solo')S.hx=myX;
  if(role==='solo')cpu(dt);
  if(S.ph==='serve'&&performance.now()>=S.serveAt)launch();
  if(S.ph!=='play')return;
  const n=Math.max(1,Math.ceil(S.spd*dt/(R*.7))),h=dt/n;
  for(let i=0;i<n;i++){
    S.bx+=S.vx*h;S.bz+=S.vz*h;
    if(S.bx>W/2-R){S.bx=W/2-R;S.vx=-Math.abs(S.vx);}
    if(S.bx<-W/2+R){S.bx=-W/2+R;S.vx=Math.abs(S.vx);}
    if(S.vz>0&&S.bz+R>=HZ-PD/2&&S.bz<HZ+PD/2&&Math.abs(S.bx-S.hx)<=PW/2+R){S.bz=HZ-PD/2-R;bounce(S.hx,-1);}
    if(S.vz<0&&S.bz-R<=-HZ+PD/2&&S.bz>-HZ-PD/2&&Math.abs(S.bx-S.gx)<=PW/2+R){S.bz=-HZ+PD/2+R;bounce(S.gx,1);}
    if(S.bz>L/2+.04){point(false);break;}
    if(S.bz<-L/2-.04){point(true);break;}
  }
}

// ---- sounds/HUD from state changes (works the same for guest) ----
let lastHits=0,lastScore='0-0',lastPh='';
const now=()=>performance.now();
function hud(){
  const meS=role==='guest'?S.sg:S.sh,themS=role==='guest'?S.sh:S.sg;
  $('score').innerHTML=`<span class="me">${meS}</span> · <span class="them">${themS}</span>`;
  if(S.hits!==lastHits){if(S.hits>lastHits){beep(S.hits%2?440:660,.05);buzz(12);}lastHits=S.hits;}
  const sc=S.sh+'-'+S.sg;if(sc!==lastScore){lastScore=sc;if(sc!=='0-0'){beep(300,.25,'sawtooth',.05);buzz([30,40,30]);}}
  let m='';
  if(mode==='xr'&&!placed)m='Point at the table and tap to place your court';
  else if(S.ph==='wait'){
    if(role==='host')m=!connected?'Waiting for your friend to join':(guestReady?'Both courts are down. Tap Start game.':'Your friend is placing their court. You can start anytime.');
    else if(role==='guest')m=connected?'Court placed. The host starts the game.':'Connecting to the host…';}
  else if(S.ph==='serve'){const meSv=(role==='guest'?-S.dir:S.dir)>0;m=meSv?'Ball coming to you':'Ball going to them';}
  if(role!=='solo'&&!connected&&started&&role==='guest')m='Connection lost';
  if(mode==='xr'&&(!placed||wantPlace)&&performance.now()-Math.max(xrT0,lastHit)>3000&&!reticle.visible)m='Can’t find the table surface yet. Tap anywhere to drop the court in front of you.';
  const bad=mode==='xr'&&badSince&&now()-badSince>2000;
  if(bad)m=xrTrack==='lost'?'AR tracking lost. Move the phone slowly, or tap Simple mode.':'AR tracking isn’t working well on this phone. Tap Simple mode to play without it.';
  if(mode==='xr')$('bMode').classList.toggle('warn',!!bad);
  $('msg').textContent=m;
  $('dbg').textContent=role==='solo'?(mode==='xr'?'ar:'+xrTrack:''):`me:${peer&&peer.id?peer.id.replace(PREFIX,'host-').slice(-10):'…'} room:${roomCode||'-'} conn:${connected?'yes':'no'} tx:${tx} rx:${rx}`+(mode==='xr'?` ar:${xrTrack}`:mode==='cam'?` cam:${useGyro&&ori?'gyro':'fixed'}`:'');
  const alive=connected&&performance.now()-lastRx<3000;
  const net=$('net');
  if(role==='solo'){net.textContent='';}
  else if(role==='host'){net.textContent=`Room ${roomCode} · `+(alive?'friend connected'+(guestReady?' · their court is down':' · placing their court'):connected?'friend not responding':'no friend yet');net.className=alive?'ok':'bad';}
  else {net.textContent=`Room ${roomCode} · `+(alive?'connected to host':'not connected');net.className=alive?'ok':'bad';}
  $('bStart').hidden=!(role==='host'&&S.ph==='wait'&&connected);
  const over=S.ph==='over';$('over').hidden=!over;
  if(over&&lastPh!=='over'){const iWon=(S.win==='h')===(role!=='guest');$('overTxt').textContent=iWon?'You win!':'You lose';
    $('overTxt').style.color=iWon?'var(--orange)':'var(--green)';beep(iWon?784:196,.45,'triangle',.08);
    $('bRematch').hidden=role==='guest';$('overSub').textContent=role==='guest'?'Waiting for the host to start a rematch':'';}
  lastPh=S.ph;
}

// ---- networking (PeerJS: host is authoritative) ----
function code4(){const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function lstat(t){$('lStatus').textContent=t;}
function hostGame(){
  if(typeof Peer==='undefined'){$('mStatus').textContent='Could not load the networking library. Check your connection.';return;}
  role='host';showLobby();const code=code4();$('roomCode').textContent='····';lstat('Opening room…');
  peer=new Peer(PREFIX+code,{debug:1});
  peer.on('open',()=>{roomCode=code;$('roomCode').textContent=code;const link=location.origin+location.pathname+'#'+code;$('qr').innerHTML='';
    try{new QRCode($('qr'),{text:link,width:170,height:170,correctLevel:QRCode.CorrectLevel.M});}catch(e){$('qr').hidden=true;}
    lstat('Waiting for your friend to join');});
  peer.on('connection',c=>{if(conn&&connected){c.close();return;}conn=c;wire();});
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();hostGame();}else lstat('Network problem: '+e.type+'. Try again or play solo.');});
}
function joinGame(code){
  code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
  if(code.length!==4){$('mStatus').textContent='Type the 4-letter code from your friend’s screen.';return;}
  if(typeof Peer==='undefined'){$('mStatus').textContent='Could not load the networking library. Check your connection.';return;}
  role='guest';roomCode=code;showLobby();$('guestCode').textContent=code;lstat('Connecting…');
  peer=new Peer({debug:1});
  peer.on('open',()=>{conn=peer.connect(PREFIX+code,{serialization:'json'});wire();});
  peer.on('error',e=>{lstat(e.type==='peer-unavailable'?'No room with that code. Check it and try again.':'Network problem: '+e.type);});
}
function wire(){
  conn.on('open',()=>{connected=true;lastRx=performance.now();lstat(role==='host'?'Friend joined. Tap Start AR.':'Connected. Tap Start AR.');});
  conn.on('data',d=>{if(!d||typeof d!=='object')return;lastRx=performance.now();rx++;
    if(role==='host'&&d.t==='p'){S.gx=clamp(-Number(d.x)||0,-W/2+PW/2,W/2-PW/2);guestReady=!!d.r;}
    if(role==='guest'&&d.t==='s'){for(const k of['bx','bz','vx','vz','hx','sh','sg','ph','hits','dir','win'])if(k in d)S[k]=d[k];rxAt=performance.now();}});
  conn.on('close',()=>{connected=false;lstat('Your friend disconnected.');if(role==='host'&&S.ph!=='wait'){S.ph='wait';started&&($('msg').textContent='Your friend disconnected');}});
}
setInterval(()=>{if(!conn||!connected)return;try{
  tx++;
  if(role==='host')conn.send({t:'s',bx:+S.bx.toFixed(4),bz:+S.bz.toFixed(4),vx:+S.vx.toFixed(4),vz:+S.vz.toFixed(4),hx:+myX.toFixed(4),sh:S.sh,sg:S.sg,ph:S.ph,hits:S.hits,dir:S.dir,win:S.win});
  else conn.send({t:'p',x:+myX.toFixed(4),r:placed});}catch(e){}},33);

// ---- AR: Android WebXR with hit-test ----
let xrSession=null,hitSrc=null;
async function startXR(){
  try{
    xrSession=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay','local-floor'],domOverlay:{root:ui}});
  }catch(e){startCam();return;}
  mode='xr';enterGame();
  renderer.xr.setReferenceSpaceType('local');await renderer.xr.setSession(xrSession);
  xrT0=performance.now();
  xrSession.addEventListener('select',()=>{if(placed&&court.visible&&!wantPlace)return;if(reticle.visible)placeCourtAtReticle();else placeFallback();});
  try{const vs=await xrSession.requestReferenceSpace('viewer');hitSrc=await xrSession.requestHitTestSource({space:vs});}catch(e){hitSrc=null;}
  xrSession.addEventListener('end',()=>{if(!toCam){location.href=location.pathname;return;}toCam=false;xrSession=null;hitSrc=null;reticle.visible=false;renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.fov=63;camera.updateProjectionMatrix();startCam();});
  $('bMode').hidden=false;$('bMode').textContent='Simple mode';
  for(const b of ui.querySelectorAll('button'))b.addEventListener('beforexrselect',e=>e.preventDefault());
  $('bStart').addEventListener('beforexrselect',e=>e.preventDefault());
  $('bPlace').textContent='Move court';
  $('hint').textContent=xrSession.domOverlayState?'Drag left and right to move your paddle':'Point your phone where you want your paddle';
}
let wantPlace=false;
function placeFallback(){ // no surface found: drop the court ~35cm below the phone, in front of you
  const c=viewPos.clone(),q=viewQ.clone();
  const f=new THREE.Vector3(0,0,-1).applyQuaternion(q),y=c.y-.35;let p;
  if(f.y<-.25){const k=(y-c.y)/f.y;p=c.clone().add(f.multiplyScalar(Math.min(k,1.2)));p.y=y;}
  else{const h=new THREE.Vector3(f.x,0,f.z);if(h.lengthSq()<1e-4)h.set(0,0,-1);h.normalize();p=c.clone().add(h.multiplyScalar(.45));p.y=y;}
  court.position.copy(p);court.rotation.set(0,Math.atan2(c.x-p.x,c.z-p.z),0);
  court.visible=true;placed=true;wantPlace=false;reticle.visible=false;beep(600,.08,'sine');
}
function placeCourtAtReticle(){
  const p=new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
  const c=viewPos.clone();
  court.position.copy(p);court.rotation.set(0,Math.atan2(c.x-p.x,c.z-p.z),0);
  court.visible=true;placed=true;wantPlace=false;reticle.visible=false;beep(600,.08,'sine');
}

// ---- AR fallback: camera passthrough + gyro anchoring (iPhone, any phone) ----
let ori=null,yawQ=new THREE.Quaternion(),recenter=true;
function startCam(){
  // ask for motion first, synchronously inside the tap (iOS requirement)
  let mp=Promise.resolve('granted');
  try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')mp=DeviceOrientationEvent.requestPermission().catch(()=>'denied');}catch(e){}
  let cp=(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)?navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}}):Promise.reject(new Error('no camera'));
  mode='cam';enterGame();xrTrack='off';$('bPlace').textContent='Re-center';$('bMode').hidden=false;$('bMode').textContent=useGyro?'Lock court':'Follow table';$('bMode').classList.remove('warn');
  const v=$('cam');
  cp.then(st=>{v.srcObject=st;v.hidden=false;v.play().catch(()=>{});}).catch(()=>{$('hint').textContent='Camera is blocked, so this plays without it. Allow camera for this site and reload to see the table.';});
  mp.then(r=>{if(r==='granted')addEventListener('deviceorientation',e=>{if(e.beta!=null)ori=e;},true);});
  camera.position.set(0,.33,.43);camera.lookAt(0,0,-.03);
  court.position.set(0,0,0);court.rotation.set(0,0,0);court.visible=true;placed=true;
  $('hint').textContent='Point your phone at the table. Drag to move your paddle.';
  setTimeout(()=>{if($('hint').textContent.startsWith('Point'))$('hint').textContent='';},6000);
}
const zee=new THREE.Vector3(0,0,1),eul=new THREE.Euler(),q0=new THREE.Quaternion(),q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5)),devQ=new THREE.Quaternion();
function camOrient(){
  if(!ori||!useGyro){camera.position.set(0,.33,.43);camera.lookAt(0,0,-.03);return;}
  const d=Math.PI/180,orient=((screen.orientation&&screen.orientation.angle)||window.orientation||0)*d;
  eul.set((ori.beta||0)*d,(ori.alpha||0)*d,-(ori.gamma||0)*d,'YXZ');devQ.setFromEuler(eul).multiply(q1).multiply(q0.setFromAxisAngle(zee,-orient));
  if(recenter){const f=new THREE.Vector3(0,0,-1).applyQuaternion(devQ);const yaw=Math.atan2(-f.x,-f.z);yawQ.setFromAxisAngle(new THREE.Vector3(0,1,0),-yaw);recenter=false;}
  camera.quaternion.copy(yawQ).multiply(devQ);
}

// ---- screens ----
function show(id){for(const s of['menu','lobby'])$(s).hidden=s!==id;$('hud').hidden=id!=='hud';}
function hint(){$('bSimpleL').hidden=!xrOK;$('modeHint').textContent=xrOK?'Full AR on this phone: you’ll tap the table to place your court.':'Camera mode on this phone: the court appears on the table in front of you. Tap Re-center if it drifts.';}
function showLobby(){show('lobby');$('hostBox').hidden=role!=='host';$('guestBox').hidden=role!=='guest';$('soloBox').hidden=role!=='solo';hint();
  if(role==='solo')lstat('');}
function enterGame(){started=true;show('hud');keepAwake();if(role==='solo'&&S.ph==='wait')begin();}
$('bHost').onclick=()=>{initAudio();hostGame();};
$('bJoin').onclick=()=>{initAudio();joinGame($('code').value);};
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')$('bJoin').click();});
$('bSolo').onclick=()=>{initAudio();role='solo';showLobby();};
$('bBack').onclick=()=>{location.href=location.pathname;};
$('bAR').onclick=()=>{initAudio();if(xrOK)startXR();else startCam();};
$('bExit').onclick=()=>{if(xrSession)xrSession.end();else location.href=location.pathname;};
$('bPlace').onclick=()=>{if(mode==='xr'){wantPlace=true;placed=false;}else recenter=true;};
$('bMode').onclick=()=>{if(mode==='xr'&&xrSession){toCam=true;xrSession.end();}else if(mode==='cam'){useGyro=!useGyro;recenter=true;$('bMode').textContent=useGyro?'Lock court':'Follow table';}};
$('bSimpleL').onclick=()=>{initAudio();startCam();};
$('bStart').onclick=()=>{initAudio();if(mode==='xr'&&!placed)placeFallback();begin();};
$('bRematch').onclick=()=>{if(role==='host'&&!connected){$('overSub').textContent='Your friend isn’t connected.';return;}begin();};

// ---- main loop ----
let last=performance.now();
renderer.setAnimationLoop((t,frame)=>{
  const now=performance.now(),dt=Math.min(.033,(now-last)/1000);last=now;
  if(frame&&mode==='xr'){const vp=frame.getViewerPose(renderer.xr.getReferenceSpace());
    if(vp){const tp=vp.transform.position,to=vp.transform.orientation;viewPos.set(tp.x,tp.y,tp.z);viewQ.set(to.x,to.y,to.z,to.w);xrTrack=vp.emulatedPosition?'limited':'ok';}else xrTrack='lost';
    if(xrTrack==='ok')badSince=0;else if(!badSince)badSince=now;}
  if(frame&&hitSrc&&(!placed||wantPlace)){const res=frame.getHitTestResults(hitSrc);
    if(res.length){const pose=res[0].getPose(renderer.xr.getReferenceSpace());reticle.visible=true;lastHit=performance.now();reticle.matrix.fromArray(pose.transform.matrix);}else reticle.visible=false;}
  if(mode==='xr'&&xrSession&&!xrSession.domOverlayState&&court.visible){ // aim control when touch overlay is unavailable
    const o=viewPos.clone(),q=viewQ.clone();
    const dir=new THREE.Vector3(0,0,-1).applyQuaternion(q);const lo=court.worldToLocal(o.clone()),lp=court.worldToLocal(o.clone().add(dir));const ld=lp.sub(lo);
    if(ld.y<-1e-3){const k=-lo.y/ld.y;myX=clamp(lo.x+ld.x*k,-W/2+PW/2,W/2-PW/2);}}
  if(mode==='cam')camOrient();
  if(role==='host'||role==='solo')physics(dt);
  if(started){placeView();hud();}
  renderer.render(scene,camera);
});

// join link: page#CODE
const h=(location.hash||'').replace('#','').toUpperCase();
if(/^[A-Z0-9]{4}$/.test(h)){$('code').value=h;setTimeout(()=>joinGame(h),300);}
window.__arpong={S,get role(){return role},begin,physics,setX(v){myX=clamp(v,-W/2+PW/2,W/2-PW/2)}};
})();
